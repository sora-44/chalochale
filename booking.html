<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking | ChaloChale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand fw-bold" href="./index.html">ChaloChale</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="./destinations.html">Destinations</a></li><li class="nav-item"><a class="nav-link" href="./packages.html">Packages</a></li><li class="nav-item"><a class="nav-link active" href="./booking.html">Booking</a></li><li class="nav-item"><a class="nav-link" href="./contact.html">Contact</a></li></ul><a href="./signup.html" class="btn btn-warning ms-lg-3">Signup</a><a href="./login.html" class="btn btn-warning ms-lg-2">Login</a></div>
    </div>
  </nav>
  <main class="booking-page flex-grow-1">
    <header class="page-heading">
      <h1>Travel Booking Form</h1>
      <p>Fill the form and submit your travel request</p>
    </header>
    <div class="container py-4 py-lg-5">
      <div class="booking-card card mx-auto">
        <div class="card-body p-3 p-md-4">
          <h2 class="text-center fw-bold fs-4 mb-4">Book Your Trip</h2>
          <form id="bookingPageForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Select Destination</label>
                <select class="form-select"><option>Goa</option><option>Manali</option><option>Kerala</option><option>Jaipur</option></select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Travel Date</label>
                <input type="date" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Number of People</label>
              <input type="number" class="form-control" min="1" placeholder="Enter number of people" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Message / Requirement</label>
              <textarea class="form-control" rows="4" placeholder="Enter any travel requirement"></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit Booking Request</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer mt-auto">© 2026 ChaloChale Travel App | Designed with Bootstrap</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>document.getElementById("bookingPageForm").addEventListener("submit", function (event) { event.preventDefault(); alert("Your booking request has been submitted!"); this.reset(); });</script>
</body>
</html>
